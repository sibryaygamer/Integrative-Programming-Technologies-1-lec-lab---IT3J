<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMLHttpRequest Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        #output {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            background-color: #f9f9f9;
            max-width: 500px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Exploring XMLHttpRequest</h2>
    <button id="loadData">Load Post Data</button>
    <div id="output">Data will appear here...</div>

    <script>
        document.getElementById("loadData").addEventListener("click", function() {
            const xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function() {
                const outputDiv = document.getElementById("output");

                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);
                        outputDiv.innerHTML = `
                            <strong>Post Title:</strong> ${data.title}<br><br>
                            <strong>Content:</strong> ${data.body}
                        `;
                    } else {
                        outputDiv.innerHTML = `<span class="error">Error: ${xhr.status} - ${xhr.statusText}</span>`;
                    }
                } else if (xhr.readyState === 3) {
                    outputDiv.innerHTML = "Loading...";
                }
            };

            xhr.open("GET", "https://jsonplaceholder.typicode.com/posts/1", true);
            
            xhr.send();
        });
    </script>
</body>
</html>
